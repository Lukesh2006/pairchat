# Publishes the PairChat web app (online mode) to GitHub Pages:
#   https://lukesh2006.github.io/pairchat/
# Only the browser app is published. serve.py and check.html are for offline mode
# on your own laptop and are left out on purpose.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hub tests
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the web app
        run: |
          mkdir _site
          cp app/index.html _site/
          cp -r app/vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
